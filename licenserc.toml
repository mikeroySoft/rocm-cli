## hawkeye license-header enforcement configuration.
## Run locally: hawkeye check
## Docs: https://github.com/fast/hawkeye

[header]
text = """
Copyright © Advanced Micro Devices, Inc., or its affiliates.

SPDX-License-Identifier: MIT
"""

[files]
includes = [
  "**/*.rs",
  "**/*.py",
  "**/*.sh",
  "**/*.md",
]

excludes = [
  "target/**",
  ".claude/**",
  ".tmp-*/**",
  "third_party/**",
  ".agents/**",
  # GitHub reads issue-template front matter only at byte 0; a header above it
  # hides the template. Fork-only file, kept identical to Factory's shipped copy.
  ".github/ISSUE_TEMPLATE/agent_task.md",
]

[[rules]]
extensions = ["md"]
style_out = "xml"
