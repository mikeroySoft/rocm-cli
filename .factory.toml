# Factory configuration for mikeroySoft/rocm-cli.

[repo]
upstream = "upstream"

[gate]
[[gate.check]]
name = "clippy"
run = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
exclusive = true

[[gate.check]]
name = "tests"
run = ["cargo", "test", "--workspace", "--all-targets"]
exclusive = true

[[gate.check]]
name = "smoke"
run = ["python3", "scripts/smoke_local.py"]
exclusive = true

[leak_scan]
exclude = [".agents", "skills", "skills-lock.json", "scripts/agent_gate.py"]
